name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'valentinzubok/EvidenceDesk'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SNAPSHOT_ADDRESS: "0x356C408058cb82934eE6f62B14FC85D52858721a"
          NEXT_PUBLIC_REGISTRY_ADDRESS: "0xc62eC7D0133867b33f50D7E9416D01A8Cc244DF3"

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Skip deploy (missing VERCEL_TOKEN)
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "Set VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID repo secrets to enable CI deploy."
