name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SNAPSHOT_ADDRESS: "0x356C408058cb82934eE6f62B14FC85D52858721a"
          NEXT_PUBLIC_REGISTRY_ADDRESS: "0xc62eC7D0133867b33f50D7E9416D01A8Cc244DF3"

      - run: npm run build-storybook

      - run: npm run sdk:build

  evidence-contract:
    name: EvidenceSnapshot v2 (contract tests + deployed-code check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest
      - name: Contract tests
        run: python3 -m pytest -q tests/test_evidence_v2.py tests/test_evidence_v2_adversarial.py
      - name: Deployed code equals this source
        run: python3 scripts/verify_evidence_v2.py
