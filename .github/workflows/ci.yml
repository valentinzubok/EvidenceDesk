name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_SNAPSHOT_ADDRESS: "0x356C408058cb82934eE6f62B14FC85D52858721a"
          NEXT_PUBLIC_REGISTRY_ADDRESS: "0xc62eC7D0133867b33f50D7E9416D01A8Cc244DF3"

      - name: Build Storybook
        continue-on-error: true
        run: npm run build-storybook

      - run: npm run sdk:build
